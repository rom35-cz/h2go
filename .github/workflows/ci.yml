name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: gofmt check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error::gofmt needed for:$files"
            echo "$files"
            exit 1
          fi

      - name: go vet (default + integration tags)
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: golangci-lint (default + integration tags)
        run: |
          # install.sh checksum verification fails for v2.13.1; download the
          # release tarball directly instead.
          curl -fsSL -o /tmp/gl.tar.gz \
            https://github.com/golangci/golangci-lint/releases/download/v2.13.1/golangci-lint-2.13.1-linux-amd64.tar.gz
          mkdir -p /tmp/gl && tar -xzf /tmp/gl.tar.gz -C /tmp/gl
          /tmp/gl/golangci-lint-2.13.1-linux-amd64/golangci-lint version
          /tmp/gl/golangci-lint-2.13.1-linux-amd64/golangci-lint run ./...
          /tmp/gl/golangci-lint-2.13.1-linux-amd64/golangci-lint run --build-tags integration ./...

      - name: unit tests
        run: go test -count=1 ./...

      - name: unit tests (-race)
        run: go test -count=1 -race ./...

      - name: CGO-free build
        run: CGO_ENABLED=0 go build ./...

  integration:
    name: Integration (live H2 2.4.240, plain + TLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download H2 jar from Maven Central
        run: |
          mkdir -p h2-data/lib
          curl -fsSL -o h2-data/lib/h2-2.4.240.jar \
            https://repo1.maven.org/maven2/com/h2database/h2/2.4.240/h2-2.4.240.jar

      - name: Generate TLS certificates (keystore + cert.pem)
        run: sh h2-data/gen-tls-certs.sh

      - name: Start plain TCP server (:9092) and TLS server (:9093)
        run: |
          mkdir -p h2-data/data
          nohup java -cp h2-data/lib/h2-2.4.240.jar org.h2.tools.Server \
            -tcp -tcpPort 9092 -tcpAllowOthers -ifNotExists \
            -baseDir h2-data/data > /tmp/h2-tcp.log 2>&1 &
          nohup java \
            -Djavax.net.ssl.keyStore=h2-data/tls/keystore.p12 \
            -Djavax.net.ssl.keyStorePassword=h2gotest \
            -cp h2-data/lib/h2-2.4.240.jar org.h2.tools.Server \
            -tcp -tcpPort 9093 -tcpSSL -tcpAllowOthers -ifNotExists \
            -baseDir h2-data/data > /tmp/h2-ssl.log 2>&1 &

          wait_for_port() {
            local port="$1"
            for _ in $(seq 1 30); do
              if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then
                exec 3>&- 3<&-
                return 0
              fi
              sleep 1
            done
            echo "::error::H2 server did not open port $port in time"
            echo "--- tcp log ---"; cat /tmp/h2-tcp.log || true
            echo "--- ssl log ---"; cat /tmp/h2-ssl.log || true
            return 1
          }
          wait_for_port 9092
          wait_for_port 9093

      - name: Sanity-check both servers via H2 Shell
        run: |
          java -cp h2-data/lib/h2-2.4.240.jar org.h2.tools.Shell \
            -url "jdbc:h2:tcp://localhost:9092/ci-sanity" \
            -user sa -password sa \
            -sql "SELECT 'tcp-ok';" | tee /dev/stderr | grep -q tcp-ok
          java -Djavax.net.ssl.trustStore=h2-data/tls/truststore.p12 \
            -Djavax.net.ssl.trustStorePassword=h2gotest \
            -cp h2-data/lib/h2-2.4.240.jar org.h2.tools.Shell \
            -url "jdbc:h2:ssl://localhost:9093/ci-sanity" \
            -user sa -password sa \
            -sql "SELECT 'ssl-ok';" | tee /dev/stderr | grep -q ssl-ok

      - name: Seed database
        run: |
          java -cp h2-data/lib/h2-2.4.240.jar org.h2.tools.RunScript \
            -url "jdbc:h2:tcp://localhost:9092/ci-go-test" \
            -user sa -password sa \
            -script h2-data/seed.sql

      - name: Integration tests
        env:
          JDBC_URL: jdbc:h2:tcp://localhost:9092/ci-go-test
          JDBC_USER: sa
          JDBC_PASSWORD: sa
          JDBC_TLS_URL: jdbc:h2:ssl://localhost:9093/ci-go-test
        run: |
          set -o pipefail
          go test -tags=integration -count=1 -v ./... 2>&1 | tee integration.log
          # Silent-skip guard: with both servers up, only the TLS test may
          # legitimately skip — and it must not skip here either.
          skips="$(grep -c '^=== SKIP' integration.log || true)"
          if [ "$skips" -gt 0 ]; then
            echo "::error::$skips integration test(s) skipped in CI environment:"
            grep '^=== SKIP' integration.log
            exit 1
          fi
          passes="$(grep -c '^--- PASS: TestIntegration_' integration.log)"
          echo "integration PASS count: $passes"
          if [ "$passes" -lt 20 ]; then
            echo "::error::suspiciously few integration passes ($passes < 20)"
            exit 1
          fi

      - name: Integration tests (-race)
        env:
          JDBC_URL: jdbc:h2:tcp://localhost:9092/ci-go-test
          JDBC_USER: sa
          JDBC_PASSWORD: sa
          JDBC_TLS_URL: jdbc:h2:ssl://localhost:9093/ci-go-test
        run: go test -tags=integration -count=1 -race ./...

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            integration.log
            /tmp/h2-tcp.log
            /tmp/h2-ssl.log
          if-no-files-found: ignore
